# Databricks Asset Bundle configuration
bundle:
  name: "iot_ingestion_framework"
  
include:
  - "resources/**/*.yml"
  - "targets/dev.yml"
  # - "targets/test.yml"  
  # - "targets/prod.yml"

variables:
  catalog:
    description: "Target Unity Catalog name"
    default: "dev_test"
  
  environment:
    description: "Deployment environment"
    default: "dev"
    
  trigger_pause_status:
    description: "Default pause status for scheduled jobs"
    default: "PAUSED"

# Global permissions
permissions:
  - user_name: "pambati@centrilogic.com"
    level: "CAN_MANAGE"
  - level: "CAN_MANAGE"
    group_name: "iot-data-engineers"
  - level: "CAN_VIEW"
    group_name: "iot-analysts"

# Global presets
presets:
  name_prefix: "${var.environment}-"
  tags:
    project: "iot-ingestion"
    team: "data-engineering"
    cost_center: "analytics" 