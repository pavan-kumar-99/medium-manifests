# Production Environment Configuration
variables:
  catalog: "prod"
  environment: "prod"

workspace:
  host: "https://adb-prod-88474350318135.15.azuredatabricks.net"  # Production workspace
  root_path: "/Shared/bundles/${bundle.name}/${bundle.target}"

mode: production

presets:
  name_prefix: "prod-"
  trigger_pause_status: "UNPAUSED"
  jobs_max_concurrent_runs: 5
  pipelines_development: false
  tags:
    environment: "prod"
    cost_center: "analytics"
    project: "iot-ingestion"

# Use shared service principal for job execution
run_as:
  service_principal_name: "12345678-1234-1234-1234-123456789012"  # Shared service principal client ID

permissions:
  - level: "CAN_MANAGE"
    group_name: "production-data-admins"
  - level: "CAN_VIEW"
    group_name: "business-analysts"

# Override job settings for production
resources:
  jobs:
    iot_ingestion_job:
      schedule:
        quartz_cron_expression: "0 0/2 * * * ?"
        timezone_id: "UTC"
        pause_status: "UNPAUSED"
      job_clusters:
        - job_cluster_key: "iot_processing_cluster"
          new_cluster:
            num_workers: 4
            autoscale:
              min_workers: 2
              max_workers: 8
            enable_elastic_disk: true
            
    config_tables_job:
      # Config job typically runs on-demand in production
      schedule:
        pause_status: "PAUSED" 